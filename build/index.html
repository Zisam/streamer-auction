<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>オークション / Auction</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta content="ie=edge" http-equiv="x-ua-compatible">
  <meta name="description" content="Streamer auction board — Japanese &amp; English (OBS-friendly)">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Shippori+Mincho:wght@400;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auction.css?v=tests1">
</head>
<body>
  <header class="header">
    <h1 class="header__title">
      <a href="index.html"><span class="header__ja">オークション</span><span class="header__en">Auction</span></a>
    </h1>
  </header>
  <main class="auc">
    <div class="auc__inner">
      <div class="auc__left">
        <p class="auc__help" help-status>
          <span class="auc__help-ja">名前 → 金額 → + でバンクに加算</span>
          <span class="auc__help-en">Name → amount → + adds to bank</span>
        </p>
        <div class="auc__controllers">
          <button class="auc__clear" type="button" title="データを消去 / Clear storage" clear>
            <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#reset"></use></svg>
          </button>
          <div class="auc__edit-wrapper">
            <button class="auc__edit" type="button" title="戻る / Undo" auc-back>
              <svg class="auc__icon auc__icon--revert" aria-hidden="true"><use xlink:href="img/sprite.svg#arrow"></use></svg>
            </button>
            <button class="auc__edit" type="button" title="進む / Redo" auc-forward>
              <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#arrow"></use></svg>
            </button>
          </div>
        </div>
        <div class="auc__cols" aria-hidden="true">
          <span>名前 / Name</span>
          <span>合計 / Total</span>
          <span>+入札 / Bid</span>
          <span></span>
        </div>
        <div class="auc__lots-wrapper">
          <div class="auc__item auc__item--first">
            <input class="auc__lot" type="text" title="名前 / Name" placeholder="名前 / Name" autocomplete="off">
            <input class="auc__total-sum" type="text" inputmode="decimal" readonly tabindex="-1" title="合計（自動） / Total (auto)" placeholder="0">
            <input class="auc__current-sum" type="text" inputmode="decimal" title="今回の入札 / Bid to add" placeholder="+金額 / Amount" autocomplete="off">
            <button class="auc__add-sum" type="button" add-sum title="合計に加算 / Add to total">
              <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#plus"></use></svg>
            </button>
          </div>
          <div class="auc__item auc__item--second">
            <input class="auc__lot" type="text" title="名前 / Name" placeholder="名前 / Name" autocomplete="off">
            <input class="auc__total-sum" type="text" inputmode="decimal" readonly tabindex="-1" title="合計（自動） / Total (auto)" placeholder="0">
            <input class="auc__current-sum" type="text" inputmode="decimal" title="今回の入札 / Bid to add" placeholder="+金額 / Amount" autocomplete="off">
            <button class="auc__add-sum" type="button" add-sum title="合計に加算 / Add to total">
              <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#plus"></use></svg>
            </button>
          </div>
          <div class="auc__item">
            <input class="auc__lot" type="text" title="名前 / Name" placeholder="名前 / Name" autocomplete="off">
            <input class="auc__total-sum" type="text" inputmode="decimal" readonly tabindex="-1" title="合計（自動） / Total (auto)" placeholder="0">
            <input class="auc__current-sum" type="text" inputmode="decimal" title="今回の入札 / Bid to add" placeholder="+金額 / Amount" autocomplete="off">
            <button class="auc__add-sum" type="button" add-sum title="合計に加算 / Add to total">
              <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#plus"></use></svg>
            </button>
          </div>
          <div class="auc__item">
            <input class="auc__lot" type="text" title="名前 / Name" placeholder="名前 / Name" autocomplete="off">
            <input class="auc__total-sum" type="text" inputmode="decimal" readonly tabindex="-1" title="合計（自動） / Total (auto)" placeholder="0">
            <input class="auc__current-sum" type="text" inputmode="decimal" title="今回の入札 / Bid to add" placeholder="+金額 / Amount" autocomplete="off">
            <button class="auc__add-sum" type="button" add-sum title="合計に加算 / Add to total">
              <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#plus"></use></svg>
            </button>
          </div>
        </div>
        <button class="auc__add-lot" type="button" add-lot title="ロットを追加 / Add lot">
          <svg class="auc__icon" aria-hidden="true"><use xlink:href="img/sprite.svg#plus"></use></svg>
          <span class="auc__add-lot-label">行を追加 / Add row</span>
        </button>
      </div>
      <div class="auc__right">
        <p class="auc__total">
          <span class="auc__label-ja">バンク</span>
          <span class="auc__label-en">Bank</span>
          <span total>0</span>
        </p>
        <p class="auc__timer-label">
          <span class="auc__label-ja">タイマー</span>
          <span class="auc__label-en">Timer</span>
        </p>
        <div class="auc__timer-wrapper">
          <div class="auc__timer">
            <button class="auc__start" type="button" start title="タイマー開始/停止 — Start/pause timer"></button>
            <p class="auc__time" timer><span minutes>10</span>:<span seconds>00</span></p>
            <button class="auc__reset" type="button" reset title="タイマーリセット / Reset timer">
              <span class="auc__label-ja">リセット</span>
              <span class="auc__label-en">Reset</span>
            </button>
          </div>
          <div class="auc__timer-controllers">
            <button class="auc__timer-btn" type="button" plus-one-min title="+1 min">+1</button>
            <button class="auc__timer-btn" type="button" plus-two-min title="+2 min">+2</button>
            <button class="auc__timer-btn" type="button" ten-min title="=10 min">=10</button>
            <button class="auc__timer-btn" type="button" minus-one-min title="-1 min">-1</button>
          </div>
        </div>

        <section class="wheel" aria-label="Roulette">
          <div class="wheel__head">
            <p class="wheel__title">
              <span class="auc__label-ja">ルーレット</span>
              <span class="auc__label-en">Roulette</span>
            </p>
            <label class="wheel__mode">
              <input type="checkbox" wheel-weighted checked>
              <span>入札比重 / Weighted by bids</span>
            </label>
          </div>
          <div class="wheel__stage">
            <div class="wheel__pointer" aria-hidden="true"></div>
            <canvas class="wheel__canvas" wheel-canvas width="360" height="360"></canvas>
          </div>
          <p class="wheel__result" wheel-result>—</p>
          <div class="wheel__actions">
            <button class="wheel__spin" type="button" wheel-spin title="スピン / Spin">スピン / Spin</button>
            <button class="wheel__refresh" type="button" wheel-refresh title="ロットから更新 / Rebuild from lots">更新 / Refresh</button>
          </div>
        </section>

        <ol class="auc__howto">
          <li><strong>1.</strong> 名前＋金額 → <strong>+</strong> / Name + amount → +</li>
          <li><strong>2.</strong> タイマーで締切 / Timer for deadline</li>
          <li><strong>3.</strong> ルーレットで当選 / Spin roulette for winner</li>
        </ol>
      </div>
    </div>
  </main>
  <footer></footer>
  <script type="module" src="js/main.min.js?v=tests1"></script>
</body>
</html>
